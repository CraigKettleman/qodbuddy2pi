name: release

# 打 tag 就发布：npm 包 + 四个平台的压缩包 + 校验值。
#
# 两条安装路径共用同一次构建：压缩包的内容来自 npm pack，所以先发布 npm，
# 再从同一个 commit 打包压缩包——两边不会出现「npm 上是新的、Release 上是旧的」。
#
# 需要仓库 secret：NPM_TOKEN（npm 的 automation token）。
# 没有这个 secret 时 npm 那步跳过，Release 照常出（tag 也能用来发预发布）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
      - name: 跑测试
        run: npm test

  npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
          registry-url: https://registry.npmjs.org
      # 版本号以 tag 为准，避免 package.json 与 tag 各写一个数
      - name: 用 tag 校准版本号
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: 有没有 NPM_TOKEN
        id: token
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "没有配置 NPM_TOKEN，跳过 npm 发布（Release 会照常生成）"
          fi
      - name: 发布到 npm
        if: steps.token.outputs.have == 'yes'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  archives:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
      - name: 用 tag 校准版本号
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: 生成四个平台的压缩包
        run: |
          chmod +x make-release.sh
          ./make-release.sh --all
      - name: 生成校验值文件
        run: |
          cd release
          shasum -a 256 ./*.tar.gz ./*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: 附到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.tar.gz release/*.zip release/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.zip release/SHA256SUMS \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: 上传构建产物（手动触发时也能下载）
        uses: actions/upload-artifact@v4
        with:
          name: qodbuddy2pi-archives
          path: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
